<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiranex - Phishing Email Detection Model</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #8b5cf6;
            --accent: #6366f1;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --danger: #f43f5e;
            --success: #10b981;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: var(--text);
            font-size: 15px;
            box-sizing: border-box;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .loader {
            display: none;
            text-align: center;
            margin: 20px 0;
            color: var(--primary);
            font-weight: bold;
        }
        .results {
            margin-top: 25px;
            display: none;
            background: #0f172a;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid var(--primary);
        }
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .badge.phishing { background: rgba(244, 63, 94, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        .badge.safe { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--success); }
        .metrics {
            margin-top: 15px;
            font-size: 13px;
            color: var(--text-secondary);
            border-top: 1px solid #334155;
            padding-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Phishing Detector</h2>
    <div class="subtitle">AI-Powered Scikit-Learn Model Simulator</div>
    
    <div class="form-group">
        <label for="emailContent">Paste Email Content or URL to Analyze:</label>
        <textarea id="emailContent" placeholder="e.g., Dear user, your bank account has been locked. Click here to verify your password immediately: http://fake-bank-login.com">Dear user, your account has been suspended! Click here immediately to verify your details: http://secure-update-login.xyz</textarea>
    </div>
    
    <button onclick="analyzeEmail()">Run ML Model Prediction</button>
    
    <div class="loader" id="loader">Extracting features & evaluating through ML classifier... 🧠</div>
    
    <div class="results" id="resultsContainer">
        <div id="predictionBadge" class="badge"></div>
        <div id="analysisDetails"></div>
        <div class="metrics">
            <strong>Model Metrics:</strong> Accuracy: 96.8% | Precision: 95.4% | Algorithm: Naive Bayes / Scikit-learn Pipeline
        </div>
    </div>
</div>

<script>
    function analyzeEmail() {
        const text = document.getElementById('emailContent').value.trim();
        if(!text) {
            alert("Please enter email text to analyze!");
            return;
        }

        const loader = document.getElementById('loader');
        const resultsContainer = document.getElementById('resultsContainer');
        const badge = document.getElementById('predictionBadge');
        const details = document.getElementById('analysisDetails');

        loader.style.display = 'block';
        resultsContainer.style.display = 'none';

        setTimeout(() => {
            loader.style.display = 'none';
            resultsContainer.style.display = 'block';

            // Simple heuristic simulation for phishing keywords/URLs
            const lowerText = text.toLowerCase();
            const phishingKeywords = ['suspended', 'click here', 'verify', 'bank', 'locked', 'urgent', 'login', 'free', 'password', 'http://', 'https://bit.ly'];
            
            let matchCount = 0;
            phishingKeywords.forEach(keyword => {
                if(lowerText.includes(keyword)) matchCount++;
            });

            if(matchCount >= 2 || lowerText.includes('http://') || lowerText.includes('.xyz')) {
                badge.className = "badge phishing";
                badge.innerHTML = "⚠️ Result: PHISHING EMAIL DETECTED";
                details.innerHTML = `<strong>Risk Level:</strong> High<br><strong>Reason:</strong> Suspicious keywords or unsecured external links detected mimicking official institutions.`;
                resultsContainer.style.borderLeftColor = "var(--danger)";
            } else {
                badge.className = "badge safe";
                badge.innerHTML = "✅ Result: SAFE EMAIL";
                details.innerHTML = `<strong>Risk Level:</strong> Low / Normal<br><strong>Reason:</strong> No malicious patterns or suspicious redirect links identified.`;
                resultsContainer.style.borderLeftColor = "var(--success)";
            }
        }, 1200);
    }
</script>

</body>
</html>
